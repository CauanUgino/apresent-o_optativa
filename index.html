<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Apresentação</title>
  <link rel="stylesheet" href="css/slides.css">
</head>
<body>

  <div id="presentation">

    <!-- Slides -->
    <div class="slide active" data-src="1.html"></div>
    <div class="slide" data-src="2.html"></div>
    <div class="slide" data-src="3.html"></div>
    <div class="slide" data-src="4.html"></div>
    <div class="slide" data-src="5.html"></div>
    <div class="slide" data-src="6.html"></div>
    <div class="slide" data-src="7.html"></div>
    <div class="slide" data-src="8.html"></div>
    <div class="slide" data-src="9.html"></div>
    <div class="slide" data-src="10.html"></div>
    <div class="slide" data-src="11.html"></div>
    <div class="slide" data-src="12.html"></div>

    <!-- Controles -->
    <div class="controls">
      <button onclick="prevSlide()">⬅ Anterior</button>
      <span id="counter">1 / 12</span>
      <button onclick="nextSlide()">Próximo ➡</button>
    </div>

  </div>

  <script src="js/slides.js"></script>
</body>
</html>
