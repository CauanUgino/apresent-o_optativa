<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <title>Apresentação PDF</title>
    <style>
        body {
            margin: 0;
            padding: 0;
        }

        .slide {
            width: 1920px;
            height: 1080px;
            page-break-after: always;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        @media print {
            * {
                animation: none !important;
                transition: none !important;
            }
        }

        @media print {
            body {
                overflow: visible;
            }
        }
    </style>
</head>

<body>
    <div class="slide"><iframe src="slide/1.html"></iframe></div>
    <div class="slide"><iframe src="slide/2.html"></iframe></div>
    <div class="slide"><iframe src="slide/3.html"></iframe></div>
    <div class="slide"><iframe src="slide/4.html"></iframe></div>
    <div class="slide"><iframe src="slide/5.html"></iframe></div>

    <div class="slide"><iframe src="slide/7.html"></iframe></div>
    <div class="slide"><iframe src="slide/8.html"></iframe></div>
    <div class="slide"><iframe src="slide/9.html"></iframe></div>

    <div class="slide"><iframe src="slide/11.html"></iframe></div>

</body>

</html>
